name: Deploy to VPS

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: # Allow manual triggering
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'develop'
        type: choice
        options:
          - main
          - develop

env:
  VPS_HOST: 103.103.20.68
  VPS_USER: ryankharisma
  VPS_PATH: ~/sourcecode

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Only deploy on main branch or manual dispatch
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H ${{ env.VPS_HOST }} >> ~/.ssh/known_hosts
      
      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} "echo 'SSH connection successful'"
      
      - name: Pull latest code on VPS
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << EOF
            cd ${{ env.VPS_PATH }}
            echo "Current directory: \$(pwd)"
            
            # Determine branch to deploy
            DEPLOY_BRANCH="${{ github.ref_name }}"
            if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              DEPLOY_BRANCH="${{ github.event.inputs.branch }}"
            fi
            
            echo "Pulling latest code from \$DEPLOY_BRANCH branch..."
            
            # Check if it's a git repository
            if [ -d ".git" ]; then
              git fetch origin
              git checkout \$DEPLOY_BRANCH || git checkout -b \$DEPLOY_BRANCH
              git pull origin \$DEPLOY_BRANCH
              echo "✅ Code pulled successfully from \$DEPLOY_BRANCH"
              git log -1 --oneline
            else
              echo "⚠️  Not a git repository, cloning..."
              git clone -b \$DEPLOY_BRANCH https://github.com/astahiam/comfunds.git .
            fi
          EOF
      
      - name: Copy updated files
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << EOF
            cd ${{ env.VPS_PATH }}
            echo "Ensuring frontend Dockerfile is in place..."
            if [ -f "Dockerfile.frontend" ] && [ ! -f "frontend/Dockerfile.frontend" ]; then
              cp Dockerfile.frontend frontend/Dockerfile.frontend
            fi
          EOF
      
      - name: Deploy application
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << EOF
            cd ${{ env.VPS_PATH }}
            echo "🚀 Starting deployment..."
            
            # Make deployment script executable
            chmod +x deploy-vps-complete.sh 2>/dev/null || true
            chmod +x run-golang-migrations.sh 2>/dev/null || true
            
            # Run deployment
            if [ -f "deploy-vps-complete.sh" ]; then
              echo "Running deployment script..."
              ./deploy-vps-complete.sh --skip-git-pull || {
                echo "⚠️  Deployment script failed, trying manual steps..."
                exit 1
              }
            else
              echo "⚠️  Deployment script not found, running manual deployment..."
              
              # Manual deployment steps
              echo "Building Docker images..."
              docker-compose build || docker compose build || {
                echo "Building images individually..."
                docker build -f Dockerfile.backend -t hajifund-backend . || true
                docker build -f frontend/Dockerfile.frontend -t hajifund-frontend ./frontend || true
              }
              
              echo "Starting services..."
              docker-compose up -d || docker compose up -d || true
            fi
          EOF
      
      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << EOF
            cd ${{ env.VPS_PATH }}
            echo "🔍 Verifying deployment..."
            
            # Check container status
            echo "Container status:"
            docker-compose ps || docker compose ps || true
            
            # Check if services are responding
            sleep 10
            echo ""
            echo "Service health checks:"
            
            # Check backend
            if curl -f http://localhost:8080/api/v1/health >/dev/null 2>&1; then
              echo "✅ Backend API: Healthy"
            else
              echo "⚠️  Backend API: Not responding (may still be starting)"
            fi
            
            # Check frontend
            if curl -f http://localhost:3000 >/dev/null 2>&1; then
              echo "✅ Frontend: Healthy"
            else
              echo "⚠️  Frontend: Not responding (may still be starting)"
            fi
            
            # Show recent logs
            echo ""
            echo "Recent logs (last 10 lines):"
            docker-compose logs --tail=10 || docker compose logs --tail=10 || true
          EOF
      
      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment workflow completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**VPS:** ${{ env.VPS_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check your application at: http://${{ env.VPS_HOST }}" >> $GITHUB_STEP_SUMMARY

