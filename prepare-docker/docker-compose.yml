version: '3.8'

services:
  # PostgreSQL Database with Sharding
  postgres:
    image: postgres:15
    container_name: hajifund-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
      - ./docker/postgres/init-comfunds00.sql:/docker-entrypoint-initdb.d/init-comfunds00.sql
      - ./docker/postgres/init-comfunds01.sql:/docker-entrypoint-initdb.d/init-comfunds01.sql
      - ./docker/postgres/init-comfunds02.sql:/docker-entrypoint-initdb.d/init-comfunds02.sql
      - ./docker/postgres/init-comfunds03.sql:/docker-entrypoint-initdb.d/init-comfunds03.sql
    ports:
      - "5432:5432"
    networks:
      - hajifund-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Session Storage
  redis:
    image: redis:7-alpine
    container_name: hajifund-redis
    command: redis-server --appendonly yes --requirepass redis123
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - hajifund-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service (Gin Gonic)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: hajifund-backend
    environment:
      # Server Configuration
      HOST: 0.0.0.0
      PORT: 8080
      GIN_MODE: release
      
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DB_SSLMODE: disable
      
      # Redis Configuration
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis123
      REDIS_DB: 0
      
      # JWT Configuration
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRATION: 24h
      
      # CORS Configuration
      ALLOWED_ORIGINS: http://103.103.20.68,http://localhost:3000,http://localhost:8080
      CORS_ORIGINS: http://103.103.20.68,http://localhost:3000,http://localhost:8080
      TRUSTED_PROXIES: 103.103.20.68,nginx,127.0.0.1
      
      # Cookie Configuration
      COOKIE_DOMAIN: 103.103.20.68
      COOKIE_PATH: /
      COOKIE_SECURE: false
      COOKIE_SAME_SITE: Lax
      COOKIE_HTTP_ONLY: true
      
      # Sharding Configuration
      SHARD_COUNT: 4
      SHARD_0_HOST: postgres
      SHARD_0_PORT: 5432
      SHARD_0_USER: postgres
      SHARD_0_PASSWORD: postgres
      SHARD_0_DB: comfunds00
      SHARD_1_HOST: postgres
      SHARD_1_PORT: 5432
      SHARD_1_USER: postgres
      SHARD_1_PASSWORD: postgres
      SHARD_1_DB: comfunds01
      SHARD_2_HOST: postgres
      SHARD_2_PORT: 5432
      SHARD_2_USER: postgres
      SHARD_2_PASSWORD: postgres
      SHARD_2_DB: comfunds02
      SHARD_3_HOST: postgres
      SHARD_3_PORT: 5432
      SHARD_3_USER: postgres
      SHARD_3_PASSWORD: postgres
      SHARD_3_DB: comfunds03
    ports:
      - "8080:8080"
    networks:
      - hajifund-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Service (Go Fiber)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: hajifund-frontend
    environment:
      # Server Configuration
      HOST: 0.0.0.0
      PORT: 3000
      GIN_MODE: release
      
      # Backend Configuration
      API_BASE_URL: http://backend:8080
      BACKEND_URL: http://backend:8080
      FRONTEND_URL: http://103.103.20.68
      
      # CORS Configuration
      ALLOWED_ORIGINS: http://103.103.20.68,http://localhost:3000,http://localhost:8080
      CORS_ORIGINS: http://103.103.20.68,http://localhost:3000,http://localhost:8080
      TRUSTED_PROXIES: 103.103.20.68,nginx,127.0.0.1
      
      # Cookie Configuration
      COOKIE_DOMAIN: 103.103.20.68
      COOKIE_PATH: /
      COOKIE_SECURE: false
      COOKIE_SAME_SITE: Lax
      COOKIE_HTTP_ONLY: true
    ports:
      - "3000:3000"
    networks:
      - hajifund-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./frontend/uploads:/app/uploads
      - ./frontend/logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy with HTTPS
  nginx:
    image: nginx:alpine
    container_name: hajifund-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - ./docker/nginx/letsencrypt:/etc/letsencrypt
    networks:
      - hajifund-network
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  hajifund-network:
    driver: bridge