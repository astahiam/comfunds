version: '3.8'

services:
  # PostgreSQL Shard 0
  postgres-comfunds00:
    image: postgres:15-alpine
    container_name: comfunds-postgres-00
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-comfunds123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data_00:/var/lib/postgresql/data
      - ./docker/postgres/init-comfunds00.sql:/docker-entrypoint-initdb.d/init-comfunds00.sql
    ports:
      - "5432:5432"
    networks:
      - comfunds-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Shard 1
  postgres-comfunds01:
    image: postgres:15-alpine
    container_name: comfunds-postgres-01
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-comfunds123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data_01:/var/lib/postgresql/data
      - ./docker/postgres/init-comfunds01.sql:/docker-entrypoint-initdb.d/init-comfunds01.sql
    ports:
      - "5433:5432"
    networks:
      - comfunds-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Shard 2
  postgres-comfunds02:
    image: postgres:15-alpine
    container_name: comfunds-postgres-02
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-comfunds123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data_02:/var/lib/postgresql/data
      - ./docker/postgres/init-comfunds02.sql:/docker-entrypoint-initdb.d/init-comfunds02.sql
    ports:
      - "5434:5432"
    networks:
      - comfunds-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Shard 3
  postgres-comfunds03:
    image: postgres:15-alpine
    container_name: comfunds-postgres-03
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-comfunds123}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data_03:/var/lib/postgresql/data
      - ./docker/postgres/init-comfunds03.sql:/docker-entrypoint-initdb.d/init-comfunds03.sql
    ports:
      - "5435:5432"
    networks:
      - comfunds-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: comfunds-backend
    environment:
      # Database Configuration
      DB_HOST: postgres-comfunds00
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-comfunds123}
      DB_SSLMODE: disable
      
      # Application Configuration
      PORT: 8080
      ENVIRONMENT: ${ENVIRONMENT:-production}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      
      # CORS Configuration
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8080:8080"
    networks:
      - comfunds-network
    depends_on:
      postgres-comfunds00:
        condition: service_healthy
      postgres-comfunds01:
        condition: service_healthy
      postgres-comfunds02:
        condition: service_healthy
      postgres-comfunds03:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: comfunds-frontend
    environment:
      # Backend API URL
      API_URL: ${API_URL:-http://backend:8080}
      
      # Application Configuration
      PORT: 3000
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "3000:3000"
    networks:
      - comfunds-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/test"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: comfunds-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - comfunds-network
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data_00:
    driver: local
  postgres_data_01:
    driver: local
  postgres_data_02:
    driver: local
  postgres_data_03:
    driver: local

networks:
  comfunds-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16