<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <!-- Background -->
  <rect width="800" height="800" fill="#E8F5E9"/>
  
  <!-- Decorative circles -->
  <circle cx="650" cy="150" r="80" fill="#81C784" opacity="0.3"/>
  <circle cx="150" cy="650" r="60" fill="#66BB6A" opacity="0.3"/>
  
  <!-- Main figure - Businessman -->
  <g transform="translate(400, 300)">
    <!-- Suit body -->
    <ellipse cx="0" cy="150" rx="120" ry="180" fill="#1976D2"/>
    
    <!-- Shirt -->
    <rect x="-60" y="100" width="120" height="150" fill="#FFFFFF"/>
    <polygon points="0,100 -30,150 30,150" fill="#1976D2"/>
    
    <!-- Tie -->
    <polygon points="0,110 -15,150 15,150" fill="#0D47A1"/>
    
    <!-- Arms -->
    <ellipse cx="-100" cy="180" rx="30" ry="80" fill="#1976D2" transform="rotate(-20 -100 180)"/>
    <ellipse cx="100" cy="180" rx="30" ry="80" fill="#1976D2" transform="rotate(20 100 180)"/>
    
    <!-- Hands -->
    <circle cx="-110" cy="240" r="25" fill="#D7A574"/>
    <circle cx="110" cy="240" r="25" fill="#D7A574"/>
    
    <!-- Head -->
    <circle cx="0" cy="30" r="60" fill="#D7A574"/>
    
    <!-- Hair/Kopiah -->
    <path d="M -50 0 Q -60 -20 -40 -40 Q 0 -50 40 -40 Q 60 -20 50 0 Z" fill="#2C3E50"/>
    
    <!-- Face features -->
    <ellipse cx="-20" cy="25" rx="8" ry="12" fill="#2C3E50"/>
    <ellipse cx="20" cy="25" rx="8" ry="12" fill="#2C3E50"/>
    <path d="M -15 50 Q 0 60 15 50" fill="none" stroke="#2C3E50" stroke-width="3"/>
    
    <!-- Beard -->
    <path d="M -35 45 Q -40 60 -30 70 Q 0 80 30 70 Q 40 60 35 45" fill="#2C3E50" opacity="0.8"/>
  </g>
  
  <!-- Digital elements -->
  <g transform="translate(150, 200)">
    <!-- Chart icon -->
    <rect x="0" y="60" width="15" height="40" fill="#4CAF50"/>
    <rect x="20" y="40" width="15" height="60" fill="#4CAF50"/>
    <rect x="40" y="20" width="15" height="80" fill="#4CAF50"/>
    <polyline points="7,65 27,45 47,25" fill="none" stroke="#FFC107" stroke-width="3"/>
  </g>
  
  <g transform="translate(600, 200)">
    <!-- Money bag icon -->
    <ellipse cx="30" cy="60" rx="35" ry="45" fill="#FFC107"/>
    <rect x="20" y="10" width="20" height="20" fill="#FFC107" rx="5"/>
    <text x="30" y="70" font-size="30" fill="#2C3E50" text-anchor="middle" font-weight="bold">$</text>
  </g>
  
  <!-- Building silhouette -->
  <g transform="translate(50, 550)">
    <rect x="0" y="0" width="60" height="150" fill="#90CAF9" opacity="0.6"/>
    <rect x="70" y="30" width="50" height="120" fill="#90CAF9" opacity="0.6"/>
    <rect x="130" y="50" width="55" height="100" fill="#90CAF9" opacity="0.6"/>
  </g>
  
  <!-- Success symbols -->
  <g transform="translate(650, 500)">
    <!-- Trophy -->
    <rect x="15" y="60" width="30" height="10" fill="#FFC107"/>
    <ellipse cx="30" cy="45" rx="20" ry="25" fill="#FFC107"/>
    <circle cx="30" cy="30" r="10" fill="#FFD54F"/>
    <path d="M 10 40 Q 5 35 10 30 L 20 35 Z" fill="#FFC107"/>
    <path d="M 50 40 Q 55 35 50 30 L 40 35 Z" fill="#FFC107"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="700" font-size="36" fill="#2C3E50" text-anchor="middle" font-weight="bold" font-family="Arial, sans-serif">
    VISIONARY. FAITH-DRIVEN. LEADER.
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="750" font-size="20" fill="#66BB6A" text-anchor="middle" font-family="Arial, sans-serif">
    Muslim Entrepreneur Success Story
  </text>
</svg>

